# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        # Every request to CLIProxyAPI goes to the in-memory fake (tests/Support/FakeCliProxy.php).
        http_client:
            mock_response_factory: App\Tests\Support\FakeCliProxy

    services:
        App\Tests\Support\FakeCliProxy:
            public: true
