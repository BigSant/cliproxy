security:
    # One person runs the hub: the user admin, whose password is ADMIN_PASSWORD (env/<env>.env, a repository secret on
    # prod). It never lands in a file, so it is compared as given; an empty password is refused by Symfony itself.
    password_hashers:
        Symfony\Component\Security\Core\User\InMemoryUser: plaintext

    providers:
        admin:
            memory:
                users:
                    admin: { password: '%env(ADMIN_PASSWORD)%', roles: ['ROLE_ADMIN'] }

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: admin
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_dashboard
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: app_logout

    access_control:
        - { path: ^/(login|_health)$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_ADMIN }

when@test:
    security:
        firewalls:
            main:
                login_throttling: false
