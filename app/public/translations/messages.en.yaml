connect:
    intro_html: 'Other tools on this computer connect to the hub at <code>%url%</code> (127.0.0.1 only). From another computer, through an SSH tunnel: <code>%tunnel%</code>. Use a Claude subscription only through Claude Code.'
    no_key: '<no key>'
    cache_ttl_html: '<strong><code>promptCacheTtl: "1h"</code> is required.</strong> With its own <code>ANTHROPIC_BASE_URL</code> and token, Claude Code (seen in 2.1.312) writes the prompt cache for 5 min instead of 1 h as when signed in with a subscription directly: after every longer pause the whole cache is written again and the 5-hour and weekly limits melt faster. Subagents have their own <code>subagentPromptCacheTtl</code> (usually 5 min by default). Whether it works shows on the Overview card “Cache writes 1 h / 5 min”.'
    cache_ttl_source_html: 'Source: gist comments (EtanHey, mmmattG), <a href="https://code.claude.com/docs/en/prompt-caching#choose-the-ttl-yourself" rel="noopener noreferrer" target="_blank">Claude Code documentation</a>.'
    claude_separate_html: 'Without changing your usual configuration: <code>CLAUDE_CONFIG_DIR=~/.claude-hub claude</code> with this file as <code>~/.claude-hub/settings.json</code>.'
    codex_separate_html: 'Separately: <code>CODEX_HOME=~/.codex-hub codex</code>. T3 Code – “Use existing CLI”.'
    t3_double_html: '<strong>T3 Code: double usage records.</strong> If T3 Code shows usage twice, set <code>requires_openai_auth = true</code> under <code>[model_providers.cliproxy]</code>. That needs a local ChatGPT sign-in with the account that is in the hub; requests still go through the hub with this key.'
    t3_double_source: 'Source: a gist comment (mmmattG, CLIProxyAPI 8.0.45), not verified.'
    check: 'Check'

