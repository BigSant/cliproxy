connect:
    intro_html: 'Kiti įrankiai šiame kompiuteryje jungiasi prie hub''o adresu <code>%url%</code> (tik 127.0.0.1). Iš kito kompiuterio – per SSH tunelį: <code>%tunnel%</code>. Claude prenumeratą naudok tik per Claude Code.'
    no_key: '<rakto nėra>'
    cache_ttl_html: '<strong><code>promptCacheTtl: "1h"</code> būtinas.</strong> Su savu <code>ANTHROPIC_BASE_URL</code> ir token''u Claude Code (pastebėta 2.1.312) prompt cache rašo 5 min., ne 1 val., kaip prisijungus prenumerata tiesiogiai: po kiekvienos ilgesnės pauzės visas cache rašomas iš naujo ir 5 val. bei savaitės limitai tirpsta greičiau. Subagentams – atskiras <code>subagentPromptCacheTtl</code> (numatyta dažniausiai 5 min.). Ar veikia, rodo Apžvalgos kortelė „Cache rašymai 1 val. / 5 min.“.'
    cache_ttl_source_html: 'Šaltinis: gist''o komentarai (EtanHey, mmmattG), <a href="https://code.claude.com/docs/en/prompt-caching#choose-the-ttl-yourself" rel="noopener noreferrer" target="_blank">Claude Code dokumentacija</a>.'
