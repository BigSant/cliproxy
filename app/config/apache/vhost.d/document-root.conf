# Symfony's front controller lives in app/public/public; keep DOCUMENT_ROOT=/ (env/common.env) and select it here.
DocumentRoot /var/www/html/public
<Directory /var/www/html/public>
    # Every path that is not a file goes to index.php (no .htaccess / symfony/apache-pack needed).
    FallbackResource /index.php
</Directory>
