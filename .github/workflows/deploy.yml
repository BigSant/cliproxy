name: Deploy
# The hub's production on this computer (setup-server build root projects/cliproxy, target prod =
# local:/home/tomas/Projects/runtime/cliproxy/prod). Started by hand: Actions -> Deploy -> Run workflow on master. It
# deploys master's commit once phpunit, lint and release are green on it, checks the health pages, and rolls back to
# the previous release when the new one is unhealthy. README, "Diegimas".
#
# GitHub Free: no environments or environment secrets. The secrets are repository Actions secrets with the PROD_
# prefix, mapped by name in the deploy steps:
#   PROD_APP_SECRET, PROD_ADMIN_PASSWORD, PROD_CLIPROXY_MANAGEMENT_KEY, PROD_CLIPROXY_API_KEY,
#   PROD_DATABASE_PASSWORD, PROD_DATABASE_ROOT_PASSWORD
#   gh secret set PROD_APP_SECRET --repo BigSant/cliproxy   (value on stdin; never echoed)
# PROD_CLIPROXY_API_KEY only seeds config.yaml on the very first start; later keys live in the hub (Nustatymai).
# PROD_CLIPROXY_UPDATE_TOKEN (optional): the hub's cron starts cliproxy-update.yml with it (README, "CLIProxyAPI
# atnaujinimas"); a fine-grained token for this repository with Actions: write only.
#
# Also started by checks.yml ("deploy") after the CLIProxyAPI update's checks pass.
#
# Every make here is setup's own project.mk, run with -f from the setup checkout beside the build root
# ($RUNNER_TEMP/setup-make), never the build root's app/Makefile.
run-name: Deploy ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
  checks: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, setup.build]
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    timeout-minutes: 60
    env:
      BUILD_ROOT: ${{ vars.BUILD_ROOT }}
      DEPLOY_ATTEMPT: manual-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The commit must have passed the checks (checks.yml) before it reaches the hub.
          for check in phpunit lint release; do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=$check" \
              --jq '[.check_runs[] | select(.conclusion != null)] | sort_by(.completed_at) | last | .conclusion // ""')
            [ "$conclusion" = success ] || { echo "::error::Check $check is not green on $GITHUB_SHA (${conclusion:-not run})"; exit 1; }
          done
          root=${BUILD_ROOT:-${SETUP_SERVER_ROOT:-/srv/setup-server}/projects/cliproxy}
          [ -f "$root/app/Makefile" ] || { echo "::error::No build root: $root/app/Makefile is missing (setup-server add-project)"; exit 1; }
          root=$(cd -P "$root" && pwd -P)
          setup=
          for candidate in "$(dirname "$root")/setup" "$(dirname "$(dirname "$root")")/setup"; do
            if [ -f "$candidate/docker/project.mk" ]; then setup=$(cd -P "$candidate" && pwd -P); break; fi
          done
          [ -n "$setup" ] || { echo "::error::No setup beside the build root $root"; exit 1; }
          printf '#!/bin/bash\nexec make -f %q -C %q SETUP_DIRECTORY=%q PROJECT_DOCKER_DIRECTORY=%q "$@"\n' \
            "$setup/docker/project.mk" "$root/app" "$setup" "$root/app" > "$RUNNER_TEMP/setup-make"
          chmod +x "$RUNNER_TEMP/setup-make"
      - name: Deploy
        id: deploy
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: production
          REF: ${{ github.sha }}
          BACKUP: "yes"
          IMAGES: auto
          CRON: auto
          CACHE: auto
          HUB_SECRET_APP_SECRET: ${{ secrets.PROD_APP_SECRET }}
          HUB_SECRET_ADMIN_PASSWORD: ${{ secrets.PROD_ADMIN_PASSWORD }}
          HUB_SECRET_CLIPROXY_MANAGEMENT_KEY: ${{ secrets.PROD_CLIPROXY_MANAGEMENT_KEY }}
          HUB_SECRET_CLIPROXY_API_KEY: ${{ secrets.PROD_CLIPROXY_API_KEY }}
          HUB_SECRET_CLIPROXY_UPDATE_TOKEN: ${{ secrets.PROD_CLIPROXY_UPDATE_TOKEN }}
          HUB_SECRET_DATABASE_PASSWORD: ${{ secrets.PROD_DATABASE_PASSWORD }}
          HUB_SECRET_DATABASE_ROOT_PASSWORD: ${{ secrets.PROD_DATABASE_ROOT_PASSWORD }}
        run: &deploy |
          set -euo pipefail
          # setup expands the names of DEPLOY_SECRETS_JSON its environment lacks; empty ones stay unset.
          DEPLOY_SECRETS_JSON=$(python3 -c 'import json, os; p = "HUB_SECRET_"
          print(json.dumps({k[len(p):]: v for k, v in os.environ.items() if k.startswith(p) and v}))')
          export DEPLOY_SECRETS_JSON
          unset "${!HUB_SECRET_@}"
          "$RUNNER_TEMP/setup-make" pipeline-deploy
      - name: Health check
        shell: bash
        run: |
          "$RUNNER_TEMP/setup-make" deploy-health ENV=prod attempt="$DEPLOY_ATTEMPT"
      - name: Code on the target
        id: state
        if: failure() && steps.deploy.outcome != 'skipped'
        shell: bash
        run: |
          # true when this attempt's code reached the target (setup's events), so a rollback is needed.
          echo "code=$("$RUNNER_TEMP/setup-make" -s deploy-status ENV=prod attempt="$DEPLOY_ATTEMPT" field=code_reached)" >> "$GITHUB_OUTPUT"
      - name: Roll back
        id: rollback
        if: failure() && steps.state.outputs.code == 'true'
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: production
          ROLLBACK: "yes"
          CACHE: auto
          HUB_SECRET_APP_SECRET: ${{ secrets.PROD_APP_SECRET }}
          HUB_SECRET_ADMIN_PASSWORD: ${{ secrets.PROD_ADMIN_PASSWORD }}
          HUB_SECRET_CLIPROXY_MANAGEMENT_KEY: ${{ secrets.PROD_CLIPROXY_MANAGEMENT_KEY }}
          HUB_SECRET_CLIPROXY_API_KEY: ${{ secrets.PROD_CLIPROXY_API_KEY }}
          HUB_SECRET_CLIPROXY_UPDATE_TOKEN: ${{ secrets.PROD_CLIPROXY_UPDATE_TOKEN }}
          HUB_SECRET_DATABASE_PASSWORD: ${{ secrets.PROD_DATABASE_PASSWORD }}
          HUB_SECRET_DATABASE_ROOT_PASSWORD: ${{ secrets.PROD_DATABASE_ROOT_PASSWORD }}
        run: *deploy
      - name: Health check after rollback
        if: failure() && steps.rollback.outcome == 'success'
        shell: bash
        run: |
          "$RUNNER_TEMP/setup-make" deploy-health ENV=prod attempt="$DEPLOY_ATTEMPT" rollback=1
