name: CLIProxyAPI update
# A new CLIProxyAPI release into the hub (README, "CLIProxyAPI atnaujinimas"). The hub's cron (app:cliproxy-update,
# every ten minutes) starts it once per release, as soon as the release's image is on Docker Hub; by hand: Actions ->
# CLIProxyAPI update -> Run workflow with the version. It tries the image (.github/ci/cliproxy-image), commits
# CLIPROXY_VERSION to master and starts the checks of that commit, which start the deploy once they are green
# (checks.yml, "deploy"; the deploy checks them again, recreates CLIProxyAPI and rolls back when unhealthy).
#
# A version that is not newer than master's pin does nothing, so a second start of the same one is harmless. A new
# major version is refused: a person tries it locally first.
#
# A push with the job's token starts no workflow by itself, so the checks are started here (workflow_dispatch is the
# exception GitHub makes for that token).
run-name: CLIProxyAPI ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: CLIProxyAPI release (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cliproxy-update
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, setup.build]
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
      - name: Newer than master's pin?
        id: pin
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Not a release version: $VERSION"; exit 1; }
          pinned=$(sed -n 's/^CLIPROXY_VERSION=//p' app/env/common.env)
          [[ $pinned =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No CLIPROXY_VERSION in app/env/common.env"; exit 1; }
          if [ "$(printf '%s\n%s\n' "$pinned" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ] || [ "$pinned" = "$VERSION" ]; then
            echo "master pins $pinned already: nothing to do."
            exit 0
          fi
          [ "${VERSION%%.*}" = "${pinned%%.*}" ] \
            || { echo "::error::$VERSION is a new major version (master pins $pinned): try it locally and change CLIPROXY_VERSION by hand"; exit 1; }
          echo "update=yes" >> "$GITHUB_OUTPUT"
      - name: Try the image
        if: steps.pin.outputs.update == 'yes'
        env:
          VERSION: ${{ inputs.version }}
        run: .github/ci/cliproxy-image "$VERSION" .
      - name: Commit the pin to master
        id: commit
        if: steps.pin.outputs.update == 'yes'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sed -i "s/^CLIPROXY_VERSION=.*/CLIPROXY_VERSION=$VERSION/" app/env/common.env
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "CLIProxyAPI $VERSION" -m "Started by the hub's cron (app:cliproxy-update); the image answered the hub's management calls." \
            app/env/common.env
          # master may have moved on since the checkout: the pin goes on top of it.
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            pull -q --rebase origin master
          git push -q origin HEAD:master
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Checks, then the deploy
        if: steps.pin.outputs.update == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: gh workflow run checks.yml --repo "$GITHUB_REPOSITORY" --ref master -f deploy="$SHA"
